name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go 1.27
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record tool versions
        shell: bash
        run: |
          go version
          git version

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test deterministic core and F01-F15
        run: go test ./... -count=1 -timeout=20m

      - name: Build
        run: go build -o ./bin/git-casebook ./cmd/git-casebook

  release-dry-run:
    name: Release artifact dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build v0.1.0 candidate artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version v0.1.0

      - name: Verify artifact set and SHA-256 checksums
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version v0.1.0

      - name: Execute Linux candidate
        shell: bash
        run: |
          mkdir ./dist/smoke
          tar -xzf ./dist/git-casebook_0.1.0_linux_amd64.tar.gz -C ./dist/smoke
          test "$(./dist/smoke/git-casebook --version)" = "0.1.0"
          git -c init.defaultBranch=main init ./dist/synthetic-source
          git -C ./dist/synthetic-source config user.name "Synthetic Test"
          git -C ./dist/synthetic-source config user.email "synthetic@example.invalid"
          printf 'synthetic\n' > ./dist/synthetic-source/README.md
          git -C ./dist/synthetic-source add README.md
          git -C ./dist/synthetic-source commit -m "synthetic fixture"
          ./dist/smoke/git-casebook investigate ./dist/synthetic-source --case ./dist/version.case
          python3 -c 'import json; assert json.load(open("./dist/version.case/case.json", encoding="utf-8"))["tool"]["version"] == "0.1.0"'

  linux-boundaries:
    name: Linux boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Race-check deterministic packages
        run: go test -race ./internal/... -count=1 -timeout=15m

      - name: Build offline integration test binary
        run: go test -c ./test -o ./bin/offline-integration.test

      - name: Run local investigation with egress namespace removed
        shell: bash
        run: sudo unshare --net -- env PATH="$PATH" ./bin/offline-integration.test -test.run '^TestFileURLAcquisitionRevokesNetworkBeforeAnalysis$' -test.v

      - name: Verify Linux symlink confinement
        run: go test ./test -run '^TestLinuxSymlinkDoesNotEscapeCase$' -count=1 -v
