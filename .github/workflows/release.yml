name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve reviewed release control
        shell: bash
        run: cp ./scripts/verify-release.ps1 "$RUNNER_TEMP/verify-release.ps1"

      - name: Verify existing immutable tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          tag_object="$(git rev-parse "$RELEASE_TAG")"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          remote_object="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          remote_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          test -n "$remote_object"
          test -n "$remote_commit"
          test "$remote_object" = "$tag_object"
          test "$remote_commit" = "$tag_commit"
          git -c advice.detachedHead=false -c core.hooksPath=/dev/null checkout --detach "$tag_commit"
          test "$tag_commit" = "$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "$env:RELEASE_TAG"

      - name: Verify artifact set and SHA-256 checksums
        shell: pwsh
        run: >-
          & (Join-Path $env:RUNNER_TEMP "verify-release.ps1")
          -Version "$env:RELEASE_TAG"
          -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "dist")

      - name: Verify release candidate version
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "./dist/git-casebook_${RELEASE_TAG#v}_linux_amd64.tar.gz" -C "$smoke_dir"
          test "$("$smoke_dir/git-casebook" --version)" = "${RELEASE_TAG#v}"

      - name: Publish reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/release-notes-${RELEASE_TAG}.md"
          test -f "$notes"
          mapfile -t assets < <(pwsh -NoProfile -File "$RUNNER_TEMP/verify-release.ps1" -Version "$RELEASE_TAG" -OutputDirectory "$GITHUB_WORKSPACE/dist" -ListPublishAssets)
          test "${#assets[@]}" -eq 6
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          test -z "$(find ./dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --notes-file "$notes" --title "GitCasebook $RELEASE_TAG"
