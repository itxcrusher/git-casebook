name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify existing immutable tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          test -n "$remote_commit"
          test "$remote_commit" = "$tag_commit"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "$env:RELEASE_TAG"

      - name: Verify artifact set and SHA-256 checksums
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version "$env:RELEASE_TAG"

      - name: Verify release candidate version
        shell: bash
        run: |
          mkdir ./dist/smoke
          tar -xzf "./dist/git-casebook_${RELEASE_TAG#v}_linux_amd64.tar.gz" -C ./dist/smoke
          test "$(./dist/smoke/git-casebook --version)" = "${RELEASE_TAG#v}"

      - name: Publish reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/release-notes-${RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" ./dist/* --verify-tag --notes-file "$notes" --title "GitCasebook $RELEASE_TAG"
