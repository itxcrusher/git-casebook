name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ github.ref_name }}"

      - name: Verify artifact set and SHA-256 checksums
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version "${{ github.ref_name }}"

      - name: Verify release candidate version
        shell: bash
        run: |
          mkdir ./dist/smoke
          tar -xzf "./dist/git-casebook_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C ./dist/smoke
          test "$(./dist/smoke/git-casebook --version)" = "${GITHUB_REF_NAME#v}"

      - name: Publish reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/release-notes-${GITHUB_REF_NAME#v}.md"
          test -f "$notes"
          gh release create "${{ github.ref_name }}" ./dist/* --verify-tag --notes-file "$notes" --title "GitCasebook ${{ github.ref_name }}"
