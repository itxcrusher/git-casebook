name: Bug report
description: Report deterministic behavior that differs from the documented contract.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private repositories, credentials, or sensitive case evidence.
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: 0.1.1-dev
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      placeholder: git version 2.x.y
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: synthetic-reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal generated Git steps or an already public permissive fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected evidence
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no credentials, private repository content, or sensitive case artifact.
          required: true
